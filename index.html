<!doctype html>

<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dart Trainer">
  <title>Dart Trainer</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0d0f;
      color: white;
    }
    .app {
      max-width: 560px;
      margin: auto;
      padding: 24px 16px 40px;
    }
    h1 {
      text-align: center;
      font-size: 34px;
      margin-bottom: 5px;
    }
    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }
    .card {
      background: #18181c;
      border: 1px solid #2b2b31;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      color: #bbb;
      margin-bottom: 8px;
      font-size: 14px;
    }
    select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #25252b;
      color: white;
      font-size: 17px;
      margin-bottom: 16px;
    }
    .darts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .darts button {
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: #2a2a30;
      color: white;
      font-size: 18px;
    }
    .darts button.active {
      background: white;
      color: black;
      font-weight: bold;
    }
    button.start {
      width: 100%;
      border: none;
      padding: 16px;
      border-radius: 16px;
      background: white;
      color: black;
      font-size: 18px;
      font-weight: bold;
    }
    #training {
      display: none;
    }
    .target {
      text-align: center;
      margin: 20px 0;
    }
    .target strong {
      display: block;
      font-size: 60px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .stat {
      text-align: center;
      background: #18181c;
      padding: 16px 8px;
      border-radius: 15px;
    }
    .stat span {
      display: block;
      color: #aaa;
      font-size: 13px;
    }
    .stat strong {
      font-size: 22px;
    }
    .round {
      text-align: center;
      margin: 22px 0;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .actions button {
      padding: 18px;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: bold;
    }
    .miss {
      background: #333;
      color: white;
    }
    .hit {
      background: white;
      color: black;
    }
    .back {
      border: none;
      background: none;
      color: #ccc;
      font-size: 16px;
      padding: 0;
    }
  </style>
</head>
<body>
<div class="app">
  <div id="setup">
<h1>🎯 Dart Trainer</h1>
<div class="subtitle">
  Trainiere gezielt deine Treffer
</div>
<div class="card">
  <label>Zielsegment</label>
  <select id="segment"></select>
  <label>Trefferbereich</label>
  <select id="area">
    <option value="">Gesamtes Segment</option>
    <option value="S">Single</option>
    <option value="D">Double</option>
    <option value="T" selected>Triple</option>
  </select>
</div>
<div class="card">
  <label>Darts pro Runde</label>
  <div class="darts">
    <button onclick="chooseDarts(3,this)" class="active">
      3
    </button>
    <button onclick="chooseDarts(6,this)">
      6
    </button>
    <button onclick="chooseDarts(9,this)">
      9
    </button>
  </div>
</div>
<button class="start" onclick="startTraining()">
  Training starten
</button>
  </div>
  <div id="training">
<button class="back" onclick="back()">
  ← Zurück
</button>
<div class="target">
  Ziel
  <strong id="target">
    T20
  </strong>
  <div id="roundText">
    Runde 1
  </div>
</div>
<div class="stats">
  <div class="stat">
    <span>Würfe</span>
    <strong id="throws">
      0
    </strong>
  </div>
  <div class="stat">
    <span>Treffer</span>
    <strong id="hits">
      0
    </strong>
  </div>
  <div class="stat">
    <span>Quote</span>
    <strong id="rate">
      0 %
    </strong>
  </div>
</div>
<div class="card round">
  <div id="roundCounter">
    0 / 3 Darts
  </div>
</div>
<div class="card">
  <div style="text-align:center;color:#aaa;margin-bottom:12px">
    Testmodus
  </div>
  <div class="actions">
    <button class="miss" onclick="throwDart(false)">
      Daneben
    </button>
    <button class="hit" onclick="throwDart(true)">
      Treffer
    </button>
  </div>
</div>
  </div>
</div>
<script>
let dartsPerRound = 3
let totalThrows = 0
let hits = 0
let roundThrows = 0
let round = 1
const segment = document.getElementById("segment")
for(let i=1;i<=20;i++){
  const option = document.createElement("option")
  option.value = i
  option.textContent = i
  if(i===20)
    option.selected = true
  segment.appendChild(option)
}
function chooseDarts(number,button){
  dartsPerRound = number
  document
    .querySelectorAll(".darts button")
    .forEach(b=>b.classList.remove("active"))
  button.classList.add("active")
}
function startTraining(){
  totalThrows = 0
  hits = 0
  roundThrows = 0
  round = 1
  const area =
    document.getElementById("area").value
  const seg =
    document.getElementById("segment").value
  document.getElementById("target")
    .textContent = area + seg
  document.getElementById("setup")
    .style.display="none"
  document.getElementById("training")
    .style.display="block"
  update()
}
function throwDart(hit){
  totalThrows++
  roundThrows++
  if(hit)
    hits++
  if(roundThrows >= dartsPerRound){
    round++
    roundThrows = 0
  }
  update()
}
function update(){
  document.getElementById("throws")
    .textContent = totalThrows
  document.getElementById("hits")
    .textContent = hits
  let quote = 0
  if(totalThrows>0)
    quote = hits / totalThrows * 100
  document.getElementById("rate")
    .textContent =
      quote.toFixed(1).replace(".",",")+" %"
  document.getElementById("roundText")
    .textContent =
      "Runde "+round
  document.getElementById("roundCounter")
    .textContent =
      roundThrows+" / "+
      dartsPerRound+
      " Darts"
}
function back(){
  document.getElementById("training")
    .style.display="none"
  document.getElementById("setup")
    .style.display="block"
}
</script>
</body>
</html>
